<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Currículum Vitae de Dannie Almarales Saborit.">
  <title>Currículum Vitae | Dannie Almarales Saborit</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <style>
    :root {
      --navy: #10243a;
      --background: #f1f3f6;
      --white: #ffffff;
      --text: #263445;
      --muted: #687789;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--background);
      color: var(--text);
    }

    .back-home {
  margin-bottom: 18px;
}

.back-home a {
  color: var(--navy);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
}

.back-home a:hover {
  text-decoration: underline;
}

    header {
      background: var(--navy);
      color: var(--white);
      padding: 22px 5%;
    }

    .header-content {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 23px;
      margin: 0;
    }

    .subtitle {
      font-size: 13px;
      margin-top: 6px;
      color: #d3dce6;
    }

    .language {
      display: flex;
      gap: 8px;
    }

    button, .action {
      border: 1px solid #b9c5d2;
      border-radius: 5px;
      padding: 9px 15px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }

    button {
      background: transparent;
      color: white;
    }

    button.active {
      background: white;
      color: var(--navy);
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .toolbar p {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
    }

    .action.secondary {
      background: white;
      color: var(--navy);
    }

    .viewer {
      background: white;
      border: 1px solid #d5dce4;
      border-radius: 6px;
      overflow: hidden;
      min-height: 650px;
    }

    iframe {
      display: block;
      width: 100%;
      height: 850px;
      border: 0;
    }

    footer {
      text-align: center;
      padding: 22px;
      color: var(--muted);
      font-size: 13px;
    }

    footer a {
      color: var(--navy);
      text-decoration: none;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 19px;
      }

      .toolbar {
        align-items: flex-start;
      }

      iframe {
        height: 650px;
      }

      .viewer {
        min-height: 500px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-content">
      <div>
        <h1 data-es="Currículum Vitae"
            data-en="Curriculum Vitae">Currículum Vitae</h1>
        <div class="subtitle">Dannie Almarales Saborit</div>
      </div>

      <div class="language">
        <button class="active" id="esButton"
                onclick="changeLanguage('es')">ES</button>
        <button id="enButton"
                onclick="changeLanguage('en')">EN</button>
      </div>
    </div>
  </header>

  <main>

    <div class="back-home">
  <a href="index.html" id="backLinkTop">← Volver al inicio</a>
</div>

    <div class="toolbar">
      <p id="description">
        Consulta mi currículum en formato PDF.
      </p>

      <div class="actions">
        <a class="action" id="downloadButton"
           href="documentos/CV_Dannie_Almarales.pdf"
           download>
          Descargar PDF
        </a>

        <a class="action secondary"
           href="documentos/CV_Dannie_Almarales.pdf"
           target="_blank" rel="noopener noreferrer"
           id="openButton">
          Abrir PDF
        </a>
      </div>
    </div>

    <section class="viewer">
      <iframe
        src="documentos/CV_Dannie_Almarales.pdf#toolbar=1&navpanes=0&view=FitH"
        title="Currículum Vitae de Dannie Almarales Saborit">
      </iframe>
    </section>

  </main>

  <footer>
    <a href="index.html" id="backLink">Volver a la página principal</a>
    <p>© Dannie Almarales Saborit</p>
  </footer>

  <script>
    function changeLanguage(language) {
      const english = language === 'en';

      document.documentElement.lang = language;

      document.querySelectorAll('[data-es]').forEach(element => {
        element.textContent = element.dataset[language];
      });

      document.getElementById('description').textContent =
        english
          ? 'The curriculum is available in Spanish (PDF).'
          : 'Consulta mi currículum en formato PDF.';

      document.getElementById('backLinkTop').textContent =
  english ? '← Back to homepage' : '← Volver al inicio';

      document.getElementById('downloadButton').textContent =
        english ? 'Download PDF' : 'Descargar PDF';

      document.getElementById('openButton').textContent =
        english ? 'Open PDF' : 'Abrir PDF';

      document.getElementById('backLink').textContent =
        english ? 'Back to homepage' : 'Volver a la página principal';

      document.getElementById('esButton').classList.toggle('active', !english);
      document.getElementById('enButton').classList.toggle('active', english);
    }
  </script>

</body>
</html>
